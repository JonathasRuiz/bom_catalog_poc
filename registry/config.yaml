# Local stand-in for the org's npm registry. @poc/* packages are published here;
# everything else is proxied from the public registry.
storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  "@poc/*":
    access: $all
    publish: $authenticated
  "**":
    access: $all
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
